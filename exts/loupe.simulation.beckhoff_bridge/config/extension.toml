[core]
reloadable = true
order = 0

[package]
version = "0.2.1"
category = "simulation"
title = "Beckhoff Bridge"
description = "A bridge for connecting Omniverse to Beckhoff PLCs over ADS"
authors = ["Loupe"]
repository = "https://github.com/loupeteam/Omniverse_Beckhoff_Bridge_Extension"
keywords = ["Beckhoff", "Digital Twin", "ADS", "PLC"]
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[dependencies]
"omni.kit.uiapp" = {}
# Everything used in on_startup has to be declared here. An app that lists them in
# its own dependencies is not enough: that says what to load, not what to load first
# -- only the consuming extension's manifest orders startup.
#
#   omni.timeline        get_timeline_interface() raises outright if not yet loaded
#   omni.usd             get_context() returns None before omni.usd has started
#   omni.kit.menu.utils  add_menu_items is imported at module level
"omni.timeline" = {}
"omni.usd" = {}
"omni.kit.menu.utils" = {}

[python.pipapi]
requirements = ['pyads']
use_online_index = true

[[python.module]]
name = "loupe.simulation.beckhoff_bridge"
public = true

[[test]]
# Extra dependencies only to be used during test run
dependencies = [
    "omni.kit.ui_test", # UI testing extension
]
timeout = 60