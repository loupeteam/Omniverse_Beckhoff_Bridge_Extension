[core]
reloadable = true
order = 0

[package]
version = "0.3.0"
category = "simulation"
title = "Beckhoff Bridge"
description = "Beckhoff PLC driver (ADS) for the Loupe PLC bridge: registers the driver with loupe.simulation.bridge, which owns the /PLC prims, the runtimes, the bus and the UI."
authors = ["Loupe"]
repository = "https://github.com/loupeteam/Omniverse_Beckhoff_Bridge_Extension"
keywords = ["Beckhoff", "Digital Twin", "ADS", "PLC"]
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[dependencies]
# The framework: /PLC prims, the polling runtimes, the message bus, the USD
# mirror and the window. This extension only registers a driver with it.
# "0.3" accepts any 0.3.x, including its release candidates, and nothing from 0.4.
"loupe.simulation.bridge" = { version = "0.3" }
# Installs the pip requirements below before this extension starts. Without it
# an app that enables only this extension (the omni.kit.test startup test)
# never starts pipapi, and the import of beckhoff_bridge fails.
"omni.kit.pipapi" = {}

[python.pipapi]
# pyads (the ADS transport) and beckhoff-bridge (the ADS driver, beckhoff_bridge/
# at this repo's root). plc-bridge comes in through the framework, which owns
# its exact pin: Kit installs every extension's pip requirements into one
# site-packages and does not resolve conflicts, so there is one owner.
requirements = ["pyads", "beckhoff-bridge>=0.3.0,<0.4"]
# What to import to decide whether a requirement is already satisfied. pipapi
# tries this import first and calls pip only when it fails, so a checkout
# installed into Kit's Python by tools/dev_link.py takes precedence over the
# wheels below. Without this list the check imports the requirement string
# itself, which never succeeds. A submodule rather than the package: Kit has
# the working directory on sys.path, and from the repo root the bare
# beckhoff_bridge/ folder imports as an empty namespace package, which would
# pass the check and skip the install. See the root README, "Working from a clone".
modules = ["pyads", "beckhoff_bridge.driver"]
# Until beckhoff-bridge is on PyPI its wheel ships in wheels/ in the extension
# folder (the path is relative to it), with its dependency closure;
# tools/build_wheels.py fills it. pip tries the archive first with --no-index,
# then the online index.
archiveDirs = ["wheels"]
use_online_index = true

[[python.module]]
name = "loupe.simulation.beckhoff_bridge"
public = true

[[test]]
dependencies = [
    "omni.kit.ui_test",
]
timeout = 60
