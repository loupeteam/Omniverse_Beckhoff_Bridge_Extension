[core]
reloadable = true
order = 0

[package]
version = "0.1.0"
category = "simulation"
title = "Beckhoff Bridge"
description = "A bridge for connecting Omniverse to Beckhoff PLCs over ADS"
authors = ["Loupe"]
repository = "https://github.com/loupeteam/Omniverse_Beckhoff_Bridge_Extension"
keywords = ["Beckhoff", "Digital Twin", "ADS", "PLC"]
changelog = "docs/CHANGELOG.md"
readme = "docs/README.md"
preview_image = "data/preview.png"
icon = "data/icon.png"

[dependencies]
"omni.kit.uiapp" = {}
# All three are used in on_startup, so they have to be declared here. An app that
# lists them in its own dependencies is not enough: that says what to load, not what
# to load first -- only the consuming extension's manifest orders startup.
#
#   omni.timeline / omni.physx  acquire_*_interface() raises outright
#   omni.usd                    get_context() returns None, and System.find_components
#                               guards `stage is None` but not a None context, so it
#                               dies with AttributeError: 'NoneType' has no 'get_stage'
"omni.timeline" = {}
"omni.physx" = {}
"omni.usd" = {}

[python.pipapi]
requirements = ['pyads']
use_online_index = true

[[python.module]]
name = "loupe.simulation.beckhoff_bridge"
public = true

[[test]]
# Extra dependencies only to be used during test run
dependencies = [
    "omni.kit.ui_test", # UI testing extension
    "omni.usd",
    "omni.kit.menu.utils",
    "omni.physx"
]
timeout = 60